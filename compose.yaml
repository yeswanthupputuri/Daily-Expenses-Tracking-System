
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dailyspend-backend
    env_file:
      - ./backend/.env
    environment:
      PORT: "4000"
      FRONTEND_URL: "http://localhost:3000"
      FIREBASE_SERVICE_ACCOUNT_PATH: "/run/secrets/firebase-service-account.json"
      REDIS_URL: "redis://redis:6379"
    volumes:
      - ./backend/firebase-service-account.json:/run/secrets/firebase-service-account.json:ro
    ports:
      - "4000:4000"
    depends_on:
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dailyspend-frontend
    environment:
      API_PROXY_TARGET: "http://backend:4000"
    ports:
      - "3000:3000"
    depends_on:
      - backend

  redis:
    image: redis:7-alpine
    container_name: dailyspend-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]

volumes:
  redis-data:  
